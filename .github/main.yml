name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Capacitor iOS
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned App
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=$(pwd)/build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r OtkrytkiPro.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OtkrytkiPro-IPA
          path: OtkrytkiPro.ipa
          
